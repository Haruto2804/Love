<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ngoc_anh.css</title>

    <!-- Google Fonts: Inter & JetBrains Mono hỗ trợ dấu tiếng Việt sắc nét -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --fall-duration: 12s;
            --sway-duration: 2.4s;
            --ribbon-color: #f5a6cc;
            --ribbon-glow: rgba(245, 166, 204, 0.52);
            --ribbon-accent: rgba(245, 166, 204, 0.16);
            --item-size: 13.5px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Chế độ nền mặc định (Dark Mode sang trọng) */
        body {
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 0%, #161b26 0%, #0d1016 70%);
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.45s ease;
        }

        /* Chế độ Video 9:16 nền xanh pastel giống bản gốc */
        body.video-mode {
            background: linear-gradient(180deg, #9ec9ee 0%, #c8e2f8 52%, #a5cef0 100%);
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* Khung chính rộng rãi và cân đối hơn */
        .app-shell {
            width: min(100vw, 450px);
            min-height: 100dvh;
            height: auto;
            max-height: 920px;
            padding: clamp(12px, 2.2dvh, 22px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 1.8dvh, 16px);
        }

        /* Khung vuông đen bo góc chứa trái tim ruy-băng - phóng to thêm */
        .heart-card {
            width: min(100%, 46dvh, 395px);
            aspect-ratio: 1 / 1;
            background: #050507;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.58),
                inset 0 0 44px rgba(255, 255, 255, 0.02);
            transition: box-shadow 0.35s ease, border-color 0.3s ease;
            flex-shrink: 0;
        }

        body.video-mode .heart-card {
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 18px 42px rgba(18, 42, 72, 0.28);
        }

        /* Ánh sáng nền tỏa ra từ tâm trái tim */
        .heart-ambient {
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--ribbon-accent) 0%, transparent 70%);
            filter: blur(22px);
            pointer-events: none;
            opacity: 0.75;
            will-change: transform, opacity;
            transition: background 0.35s ease;
        }

        /* Khung sân khấu trái tim - đập & rung theo nhạc */
        .heart-stage {
            position: absolute;
            inset: 0;
            will-change: transform;
            transform-origin: center center;
        }

        /* Container gốc đặt ở chính giữa card */
        .heart {
            position: absolute;
            inset: 50% auto auto 50%;
            width: 0;
            height: 0;
            transform: rotate(-6deg);
        }

        /* Từng dòng chữ tạo nên dải ruy-băng trái tim 3D */
        .heart_item {
            position: absolute;
            inset: 0 auto auto 0;
            color: var(--ribbon-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: var(--item-size);
            font-weight: 500;
            letter-spacing: 0.2px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0.92;
            text-shadow: 0 0 10px var(--ribbon-glow);
            animation:
                sway var(--sway-duration) ease-in-out infinite alternate,
                fall var(--fall-duration) linear infinite;
            animation-delay:
                calc(var(--index) * var(--sway-stagger) * -1),
                calc(var(--index) * var(--fall-stagger) * -1);
            will-change: transform, translate;
            transition: color 0.35s ease, text-shadow 0.35s ease;
        }

        /* Hiệu ứng gợn sóng chéo tạo độ dày ruy-băng */
        @keyframes sway {
            0% {
                translate: -10px -6px;
            }

            100% {
                translate: 10px 6px;
            }
        }

        /* Vòng sóng lan tỏa khi chạm vào trái tim */
        .tap-ripple {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1.5px solid var(--ribbon-color);
            box-shadow: 0 0 14px var(--ribbon-glow);
            transform: translate(-50%, -50%) scale(0.3);
            opacity: 0.9;
            pointer-events: none;
            animation: rippleOut 0.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes rippleOut {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 0.85;
            }

            100% {
                transform: translate(-50%, -50%) scale(9.5);
                opacity: 0;
            }
        }

        /* Cửa sổ điều khiển kiểu macOS code editor - kích thước rộng rãi hơn */
        .mac-card {
            width: 100%;
            background: #17191f;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 20px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.46);
            overflow: hidden;
            flex-shrink: 0;
        }

        body.video-mode .mac-card {
            box-shadow: 0 18px 40px rgba(15, 38, 66, 0.28);
        }

        /* Equalizer động phản hồi nhịp điệu bài hát */
        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 14px;
            width: 16px;
        }

        .eq-bar {
            width: 2.5px;
            height: 4px;
            border-radius: 2px;
            background: var(--ribbon-color);
            transition: height 0.08s ease, background 0.35s ease;
        }

        /* Ẩn thanh cuộn cho hàng chip chọn nhanh */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Nút chọn màu */
        .color-dot {
            width: 17px;
            height: 17px;
            border-radius: 9999px;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: #ffffff;
            transform: scale(1.12);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
        }

        /* Fallback cho màn hình ngang cực thấp */
        @media (max-height: 600px) {
            body {
                overflow-y: auto;
                align-items: flex-start;
            }

            .app-shell {
                height: auto;
                max-height: none;
                padding: 16px 12px;
            }

            .heart-card {
                width: min(88vw, 320px);
            }
        }
    </style>
</head>

<body>
    <main class="app-shell">
        <!-- Thanh nhỏ phía trên: chọn màu ruy-băng & chuyển nền Video 9:16 -->
        <header class="w-full flex items-center justify-between px-1">

                <span class="text-[12px] font-mono-code text-slate-400 mr-0.5">màu</span>
                <button type="button" class="color-dot active" data-theme="pink" style="background:#f5a6cc;"
                    aria-label="Màu hồng"></button>

                title="Chuyển đổi nền Tối / Video 9:16">
                <span id="backdropDot" class="w-2.5 h-2.5 rounded-full bg-[#9ec9ee]"></span>
                <span id="backdropLabel">Nền Video 9:16</span>
            </button>
        </header>

        <!-- Khung trái tim chạy chữ ruy-băng (màn hình trái tim lớn hơn) -->
        <section id="heartCard" class="heart-card" role="button" tabindex="0"

                <span

            <!-- Nội dung nhập chữ & phản hồi console -->

                        <span class="text-[#f5a6cc]" id="selectorTint">.heart_ribbon</span> {
                    </div>

                    <label for="ribbonInput"

                <!-- Hàng chip chọn nhanh câu chữ -->

                    <button type="button"

                    <button type="button"

                    <!-- Hiển thị tên bài Sugar MP3 -->
                    <div
                        class="flex items-center gap-2.5 min-w-0 flex-1 bg-[#0e1015] px-3.5 py-2.5 rounded-xl border border-white/[0.08]">

                            fill="currentColor">

                                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />

                        <div class="min-w-0 flex-1">

                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <!-- Thẻ Audio nạp sẵn file sugar.mp3 -->
        <audio id="defaultAudio" src="./sugar.mp3" preload="auto" loop></audio>

    <script>
        const CUSTOM_AUDIO_URL = "./sugar.mp3";

        const RIBBON_COUNT = 92;
        const FALL_DURATION = 12;
        const SWAY_DURATION = 2.4;
        const PATH_STEPS = 120;

        const COLOR_THEMES = {
            pink: {
                color: "#f5a6cc",
                glow: "rgba(245, 166, 204, 0.54)",
                accent: "rgba(245, 166, 204, 0.16)"
            },
            ice: {
                color: "#9edbff",
                glow: "rgba(158, 219, 255, 0.52)",
                accent: "rgba(158, 219, 255, 0.15)"
            },
            lavender: {
                color: "#c9b3ff",
                glow: "rgba(201, 179, 255, 0.54)",
                accent: "rgba(201, 179, 255, 0.16)"
            },
            cream: {
                color: "#ffe4b8",
                glow: "rgba(255, 228, 184, 0.50)",
                accent: "rgba(255, 228, 184, 0.14)"
            }
        };

        const heartCard = document.getElementById("heartCard");
        const heartStage = document.getElementById("heartStage");
        const heartAmbient = document.getElementById("heartAmbient");
        const heart = document.getElementById("heart");
        const ribbonInput = document.getElementById("ribbonInput");
        const clearInputBtn = document.getElementById("clearInputBtn");
        const charCounter = document.getElementById("charCounter");
        const consoleComment = document.getElementById("consoleComment");
        const selectorTint = document.getElementById("selectorTint");
        const backdropToggle = document.getElementById("backdropToggle");
        const backdropLabel = document.getElementById("backdropLabel");
        const backdropDot = document.getElementById("backdropDot");

        let keyframeStyleEl = null;
        const heartItemNodes = [];

        function buildHeartKeyframes() {
            const cardWidth = heartCard.clientWidth || 395;
            const scale = cardWidth * 0.0218;
            const SAMPLES = 720;
            const pts = [];
            const cumDist = [0];

            for (let i = 0; i <= SAMPLES; i++) {
                const t = (i / SAMPLES) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (
                    -(
                        13 * Math.cos(t) -
                        5 * Math.cos(2 * t) -
                        2 * Math.cos(3 * t) -
                        Math.cos(4 * t)
                    ) - 2.2
                ) * scale;

                pts.push({ x, y });
                if (i > 0) {
                    cumDist.push(cumDist[i - 1] + Math.hypot(x - pts[i - 1].x, y - pts[i - 1].y));
                }
            }

            const totalLen = cumDist[SAMPLES];
            let css = "@keyframes fall {\n";
            let ptr = 0;

            for (let k = 0; k <= PATH_STEPS; k++) {
                const targetDist = (k / PATH_STEPS) * totalLen;
                while (ptr < SAMPLES - 1 && cumDist[ptr + 1] < targetDist) {
                    ptr++;
                }
                const segLen = cumDist[ptr + 1] - cumDist[ptr] || 1;
                const ratio = (targetDist - cumDist[ptr]) / segLen;
                const x = pts[ptr].x + (pts[ptr + 1].x - pts[ptr].x) * ratio;
                const y = pts[ptr].y + (pts[ptr + 1].y - pts[ptr].y) * ratio;
                const pct = ((k / PATH_STEPS) * 100).toFixed(3);

                css += `  ${pct}% { transform: translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translate(-50%, -50%) rotate(-20deg); }\n`;
            }
            css += "}";

            if (!keyframeStyleEl) {
                keyframeStyleEl = document.createElement("style");
                document.head.appendChild(keyframeStyleEl);
            }
            keyframeStyleEl.textContent = css;
        }

        function initRibbonItems(initialText) {
            heart.innerHTML = "";
            heartItemNodes.length = 0;

            const fallStagger = FALL_DURATION / RIBBON_COUNT;
            const swayStagger = (SWAY_DURATION * 4) / RIBBON_COUNT;

            heart.style.setProperty("--fall-stagger", `${fallStagger.toFixed(4)}s`);
            heart.style.setProperty("--sway-stagger", `${swayStagger.toFixed(4)}s`);

            const frag = document.createDocumentFragment();
            for (let i = 0; i < RIBBON_COUNT; i++) {
                const span = document.createElement("span");
                span.className = "heart_item";
                span.textContent = initialText;
                span.style.setProperty("--index", i);
                frag.appendChild(span);
                heartItemNodes.push(span);
            }
            heart.appendChild(frag);
            adjustRibbonFontSize(initialText);
        }

        function adjustRibbonFontSize(text) {
            const cardWidth = heartCard.clientWidth || 395;
            const base = Math.max(11.5, Math.min(14.5, cardWidth * 0.038));
            const len = text.length;
            let size = base;
            if (len > 18) size = base * 0.82;
            else if (len > 13) size = base * 0.90;
            document.documentElement.style.setProperty("--item-size", `${size.toFixed(1)}px`);
        }

        function updateRibbonTextInPlace(rawValue) {
            const trimmed = rawValue.trim();
            const displayText = trimmed.length > 0 ? trimmed : "♡";

            for (let i = 0; i < heartItemNodes.length; i++) {
                heartItemNodes[i].textContent = displayText;
            }

            adjustRibbonFontSize(displayText);
            charCounter.textContent = `${rawValue.length}/24`;
            updateConsoleComment(rawValue);
        }

        function stripVietnameseAccents(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d");
        }

        let lastComment = "";
        function updateConsoleComment(rawValue) {
            const trimmed = rawValue.trim();
            const norm = stripVietnameseAccents(trimmed);

            let msg = "// gõ thử chữ gì đó xem nó chạy nè";

            if (trimmed.length === 0) {
                msg = "// bỏ trống là tim chạy bằng niềm tin đó";
            } else if (norm.includes("sugar")) {
                msg = "// yes please, won't you come and put it down on me";
            } else if (norm.includes("tra sua")) {
                msg = "// chốt đơn, 50% đường ít đá nha";
            } else if (norm.includes("gian")) {
                msg = "// thôi đừng giận, code nãy giờ mỏi tay lắm";
            } else if (norm.includes("ngu")) {
                msg = "// đi ngủ sớm đi đừng thức khuya nữa";
            } else if (norm.includes("dep") || norm.includes("xinh")) {
                msg = "// cái này khỏi cần chạy code cũng biết";
            } else if (norm.includes("yeu") || norm.includes("thich") || norm.includes("thuong")) {
                msg = "// ê đừng làm dev ngại chứ";
            } else if (norm.includes("ngoc anh")) {
                msg = "// chính chủ điểm danh";
            } else if (norm.includes("nuoc")) {
                msg = "// nhắc nhẹ chứ sợ mải làm quên uống";
            } else if (norm.includes("doi") || norm.includes("di an")) {
                msg = "// chốt kèo đi ăn liền luôn";
            }

            if (msg !== lastComment) {
                lastComment = msg;
                consoleComment.style.opacity = "0.35";
                setTimeout(() => {
                    consoleComment.textContent = msg;
                    consoleComment.style.opacity = "1";
                }, 90);
            }
        }

        ribbonInput.addEventListener("input", (e) => {
            updateRibbonTextInPlace(e.target.value);
        });

        clearInputBtn.addEventListener("click", () => {
            ribbonInput.value = "";
            updateRibbonTextInPlace("");
            ribbonInput.focus();
        });

        document.querySelectorAll(".chip-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                const phrase = btn.getAttribute("data-phrase") || "";
                ribbonInput.value = phrase;
                updateRibbonTextInPlace(phrase);
                triggerHeartBurst();
            });
        });

        document.querySelectorAll(".color-dot").forEach((dot) => {
            dot.addEventListener("click", () => {
                const key = dot.getAttribute("data-theme");
                const theme = COLOR_THEMES[key];
                if (!theme) return;

                document.querySelectorAll(".color-dot").forEach((d) => d.classList.remove("active"));
                dot.classList.add("active");

                document.documentElement.style.setProperty("--ribbon-color", theme.color);
                document.documentElement.style.setProperty("--ribbon-glow", theme.glow);
                document.documentElement.style.setProperty("--ribbon-accent", theme.accent);
                selectorTint.style.color = theme.color;
            });
        });

        backdropToggle.addEventListener("click", () => {
            const isVideoMode = document.body.classList.toggle("video-mode");
            backdropLabel.textContent = isVideoMode ? "Nền Tối" : "Nền Video 9:16";
            backdropDot.style.background = isVideoMode ? "#17191f" : "#9ec9ee";
        });

        function triggerHeartBurst(clientX, clientY) {
            targetScale = Math.max(targetScale, 1.15);
            vibeIntensity = Math.max(vibeIntensity, 4.0);

            if (!animFrameId) {
                animFrameId = requestAnimationFrame(updateBeatLoop);
            }

            const rect = heartCard.getBoundingClientRect();
            const x = typeof clientX === "number" ? clientX - rect.left : rect.width / 2;
            const y = typeof clientY === "number" ? clientY - rect.top : rect.height / 2;

            const ripple = document.createElement("span");
            ripple.className = "tap-ripple";
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            heartCard.appendChild(ripple);
            setTimeout(() => ripple.remove(), 750);
        }

        heartCard.addEventListener("click", (e) => {
            triggerHeartBurst(e.clientX, e.clientY);
        });

        heartCard.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                triggerHeartBurst();
            }
        });

        const playBtn = document.getElementById("playBtn");
        const iconPlay = document.getElementById("iconPlay");
        const iconPause = document.getElementById("iconPause");
        const eqBars = document.getElementById("eqBars");
        const trackTitle = document.getElementById("trackTitle");
        const uploadMp3Btn = document.getElementById("uploadMp3Btn");
        const mp3Input = document.getElementById("mp3Input");
        const muteBtn = document.getElementById("muteBtn");
        const iconVolOn = document.getElementById("iconVolOn");
        const iconVolOff = document.getElementById("iconVolOff");

        const AudioEngine = {
            audio: null,
            ctx: null,
            analyser: null,
            sourceNode: null,
            dataArray: null,
            isPlaying: false,
            isMuted: false,
            customUrlObject: null,
            trackName: "Sugar - Maroon 5",

            init() {
                if (this.audio) return;
                this.audio = document.getElementById("defaultAudio") || new Audio(CUSTOM_AUDIO_URL);
                this.audio.loop = true;
                this.audio.volume = 0.85;

                this.audio.addEventListener("ended", () => {
                    this.pause();
                });

                this.audio.addEventListener("error", (e) => {
                    console.warn("Lỗi nạp audio:", e);
                    this.pause();
                    consoleComment.textContent = `// không tìm thấy file: sugar.mp3`;
                    lastComment = consoleComment.textContent;
                });
            },

            setupWebAudio() {
                if (this.ctx) return;
                if (window.location.protocol === "file:") {
                    // Trên file://, Chrome chặn MediaElement qua Web Audio gây mất tiếng,
                    // AudioEngine phát trực tiếp và chạy bộ beat-sync 120 BPM chính xác.
                    return;
                }

                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.analyser.smoothingTimeConstant = 0.75;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                    this.sourceNode = this.ctx.createMediaElementSource(this.audio);
                    this.sourceNode.connect(this.analyser);
                    this.analyser.connect(this.ctx.destination);
                } catch (e) {
                    console.warn("Web Audio API warning:", e);
                    this.ctx = null;
                    this.analyser = null;
                }
            },

            start() {
                this.init();
                this.setupWebAudio();

                if (this.ctx && this.ctx.state === "suspended") {
                    this.ctx.resume();
                }

                this.audio.muted = this.isMuted;
                const promise = this.audio.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        this.isPlaying = true;
                        updatePlayerUI();
                        if (!animFrameId) {
                            animFrameId = requestAnimationFrame(updateBeatLoop);
                        }
                        consoleComment.textContent = `// đang phát: ${this.trackName}`;
                        lastComment = consoleComment.textContent;
                    }).catch((err) => {
                        console.warn("Lỗi phát audio:", err);
                        this.isPlaying = false;
                        updatePlayerUI();
                    });
                }
            },

            pause() {
                if (this.audio) {
                    this.audio.pause();
                }
                this.isPlaying = false;
                updatePlayerUI();
            },

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.audio) {
                    this.audio.muted = this.isMuted;
                }
                iconVolOn.classList.toggle("hidden", this.isMuted);
                iconVolOff.classList.toggle("hidden", !this.isMuted);
            },

            loadCustomAudioSource(srcUrl, displayName) {
                this.init();
                this.pause();

                this.audio.src = srcUrl;
                this.trackName = displayName;
                trackTitle.textContent = displayName;
                trackTitle.title = displayName;

                if (!this.ctx && typeof window.AudioContext !== "undefined") {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        this.ctx = new AudioCtx();
                        this.analyser = this.ctx.createAnalyser();
                        this.analyser.fftSize = 256;
                        this.analyser.smoothingTimeConstant = 0.75;
                        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                        this.sourceNode = this.ctx.createMediaElementSource(this.audio);
                        this.sourceNode.connect(this.analyser);
                        this.analyser.connect(this.ctx.destination);
                    } catch (e) {
                        console.warn("Web Audio setup warning:", e);
                    }
                }

                this.start();
            },

            // Tự động phát khi tải trang + cơ chế fallback chạm màn hình lần đầu nếu bị chặn autoplay
            loadDefaultAndAutoPlay() {
                this.init();

                const unlockOnGesture = () => {
                    if (this.audio && this.audio.paused && !this.isPlaying) {
                        this.start();
                    }
                    window.removeEventListener("pointerdown", unlockOnGesture);
                    window.removeEventListener("keydown", unlockOnGesture);
                    window.removeEventListener("touchstart", unlockOnGesture);
                };

                // Lắng nghe tương tác chạm / click đầu tiên để phát ngay nếu trình duyệt chặn autoplay
                window.addEventListener("pointerdown", unlockOnGesture, { once: true });
                window.addEventListener("keydown", unlockOnGesture, { once: true });
                window.addEventListener("touchstart", unlockOnGesture, { once: true });

                const promise = this.audio.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        this.isPlaying = true;
                        this.setupWebAudio();
                        updatePlayerUI();
                        if (!animFrameId) {
                            animFrameId = requestAnimationFrame(updateBeatLoop);
                        }
                    }).catch(() => {
                        // Trình duyệt chặn autoplay tự động, đợi tương tác người dùng
                        updatePlayerUI();
                        consoleComment.textContent = "// chạm vào màn hình hoặc bấm play để bật nhạc";
                        lastComment = consoleComment.textContent;
                    });
                }
            }
        };

        function updatePlayerUI() {
            iconPlay.classList.toggle("hidden", AudioEngine.isPlaying);
            iconPause.classList.toggle("hidden", !AudioEngine.isPlaying);
            if (!AudioEngine.isPlaying) {
                eqBars.querySelectorAll(".eq-bar").forEach(b => b.style.height = "");
            }
        }

        let animFrameId = null;
        let currentScale = 1.0;
        let targetScale = 1.0;
        let currentGlow = 0.75;
        let targetGlow = 0.75;
        let vibeIntensity = 0;
        let vibeX = 0;
        let vibeY = 0;

        function updateBeatLoop() {
            if (!AudioEngine.isPlaying) {
                currentScale += (1.0 - currentScale) * 0.14;
                currentGlow += (0.75 - currentGlow) * 0.14;
                vibeX = 0;
                vibeY = 0;

                const diff = Math.abs(currentScale - 1.0);
                if (diff > 0.001) {
                    heartStage.style.transform = `scale(${currentScale.toFixed(4)})`;
                    heartAmbient.style.transform = `scale(${(currentScale * 1.08).toFixed(4)})`;
                    heartAmbient.style.opacity = currentGlow.toFixed(3);
                    animFrameId = requestAnimationFrame(updateBeatLoop);
                } else {
                    heartStage.style.transform = "";
                    heartAmbient.style.transform = "";
                    heartAmbient.style.opacity = "0.75";
                    animFrameId = null;
                }
                return;
            }

            let beatStrength = 0;
            let hasSpectrumData = false;

            if (AudioEngine.analyser && AudioEngine.dataArray) {
                AudioEngine.analyser.getByteFrequencyData(AudioEngine.dataArray);
                let bassSum = 0;
                const bassBins = Math.min(6, AudioEngine.dataArray.length);
                for (let i = 0; i < bassBins; i++) {
                    bassSum += AudioEngine.dataArray[i];
                }
                const bassAvg = bassSum / bassBins;
                if (bassAvg > 8) {
                    hasSpectrumData = true;
                    beatStrength = Math.min(1.0, (bassAvg / 255) * 1.35);
                }
            }

            if (!hasSpectrumData && AudioEngine.audio && !AudioEngine.audio.paused) {
                const curTime = AudioEngine.audio.currentTime;
                const beatPhase = (curTime % 0.500) / 0.500;

                let kick = 0;
                if (beatPhase < 0.26) {
                    kick = Math.pow(1 - beatPhase / 0.26, 2.2);
                } else if (beatPhase >= 0.44 && beatPhase < 0.72) {
                    const sub = (beatPhase - 0.44) / 0.28;
                    kick = Math.pow(1 - sub, 2.0) * 0.44;
                }
                beatStrength = kick;
            }

            targetScale = 1.0 + beatStrength * 0.105;
            targetGlow = 0.75 + beatStrength * 0.38;

            if (beatStrength > 0.38) {
                vibeIntensity = Math.max(vibeIntensity, beatStrength * 3.2);
            }
            vibeIntensity *= 0.82;

            if (vibeIntensity > 0.12) {
                vibeX = (Math.random() - 0.5) * vibeIntensity;
                vibeY = (Math.random() - 0.5) * vibeIntensity;
            } else {
                vibeX = 0;
                vibeY = 0;
            }

            const speed = targetScale > currentScale ? 0.36 : 0.18;
            currentScale += (targetScale - currentScale) * speed;
            currentGlow += (targetGlow - currentGlow) * 0.22;

            heartStage.style.transform = `scale(${currentScale.toFixed(4)}) translate(${vibeX.toFixed(2)}px, ${vibeY.toFixed(2)}px)`;
            heartAmbient.style.transform = `scale(${(currentScale * 1.12).toFixed(4)})`;
            heartAmbient.style.opacity = currentGlow.toFixed(3);

            updateEqBars(beatStrength);

            animFrameId = requestAnimationFrame(updateBeatLoop);
        }

        function updateEqBars(beatStrength) {
            const bars = eqBars.querySelectorAll(".eq-bar");
            if (bars.length < 4) return;

            if (AudioEngine.dataArray && AudioEngine.analyser) {
                bars[0].style.height = `${Math.max(3, (AudioEngine.dataArray[1] / 255) * 13)}px`;
                bars[1].style.height = `${Math.max(3, (AudioEngine.dataArray[4] / 255) * 13)}px`;
                bars[2].style.height = `${Math.max(3, (AudioEngine.dataArray[8] / 255) * 13)}px`;
                bars[3].style.height = `${Math.max(3, (AudioEngine.dataArray[14] / 255) * 13)}px`;
            } else {
                const b = beatStrength;
                const now = Date.now();
                bars[0].style.height = `${Math.max(3, b * 11 + 3)}px`;
                bars[1].style.height = `${Math.max(3, Math.sin(now * 0.016) * 3 + b * 7 + 4)}px`;
                bars[2].style.height = `${Math.max(3, b * 10 + 3.5)}px`;
                bars[3].style.height = `${Math.max(3, Math.cos(now * 0.018) * 3 + b * 6 + 3)}px`;
            }
        }

        playBtn.addEventListener("click", () => {
            if (AudioEngine.isPlaying) {
                AudioEngine.pause();
            } else {
                AudioEngine.start();
            }
        });

        uploadMp3Btn.addEventListener("click", () => {
            mp3Input.click();
        });

        mp3Input.addEventListener("change", (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            if (AudioEngine.customUrlObject) {
                URL.revokeObjectURL(AudioEngine.customUrlObject);
            }
            AudioEngine.customUrlObject = URL.createObjectURL(file);
            AudioEngine.loadCustomAudioSource(AudioEngine.customUrlObject, file.name);
            consoleComment.textContent = `// đang phát: ${file.name}`;
            lastComment = consoleComment.textContent;
        });

        muteBtn.addEventListener("click", () => {
            AudioEngine.toggleMute();
        });

        let resizeRaf = null;
        window.addEventListener("resize", () => {
            cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(() => {
                buildHeartKeyframes();
                adjustRibbonFontSize(ribbonInput.value.trim() || "♡");
            });
        });

        window.addEventListener("DOMContentLoaded", () => {
            buildHeartKeyframes();
            initRibbonItems(ribbonInput.value);
            updateConsoleComment(ribbonInput.value);
            AudioEngine.loadDefaultAndAutoPlay();
        });
    </script>
</body>
